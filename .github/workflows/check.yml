name: check

# Runs the mod's real image commands on each system it supports.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: commands on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ImageMagick
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Check the commands
        run: npx -y tsx --tsconfig scripts/tsconfig.json scripts/check-host.ts
